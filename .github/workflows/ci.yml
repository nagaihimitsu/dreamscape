name: CI

# Pull requests check only the build. The unit tests run by hand
# (workflow_dispatch), as do the E2E workflows (e2e.yml, e2e-explore.yml).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels the unfinished run.
  # A manual run gets a group of its own and always finishes.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Content, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # content:build, typecheck, vite build, then the check that dist holds
      # no Debug or test code (scripts/check-dist.ts). The official content
      # check validates every Ink branch without the validation cache.
      - name: Build content, check types and build for production
        run: npm run build
        env:
          DREAMSCAPE_INK_CACHE: "off"

  unit-shard:
    # Unit tests run by hand only (workflow_dispatch); pull requests check the build.
    if: github.event_name == 'workflow_dispatch'
    # The unit tests in parallel parts: vitest --shard gives each job a share of
    # the test files (chosen from a hash of each file's path); together the
    # jobs run every file of `npm test`, which stays one run locally and in
    # `npm run verify`. To change the number of parts, change only the list
    # in matrix.shard (1 … N): the job names and --shard follow its length.
    name: Unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # pretest builds the content first. The Ink validation cache lives in
      # node_modules/.cache, which npm ci starts empty: the tests reuse only
      # results computed in this job.
      - name: Run this part of the unit tests
        run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  unit:
    # One check named "Unit tests" whatever the number of parts: it passes
    # only when every part passed. It runs even when a part failed or the run
    # was cancelled, and then fails: a skipped check could count as passed
    # for a required check (branch protection).
    name: Unit tests
    needs: unit-shard
    # By hand only, like the parts.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the unit tests passed
        run: test "${{ needs.unit-shard.result }}" = success
