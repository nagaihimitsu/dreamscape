<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS 見本 7（共通のタイムライン）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=Klee+One:wght@600&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="sns.css">
<style>
  /* 出会った人の入口：1行のボタン（顔を重ねた印）→ 全員の一覧 */
  .people { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin: 0 0 4px; padding: 6px 12px; border: 0; border-radius: 12px; background: var(--ds-parchment-2); color: var(--ds-ink); font: inherit; font-size: 14px; text-align: left; }
  .people .label { font-weight: 700; white-space: nowrap; }
  .people .faces { display: flex; margin-left: auto; }
  .people .faces img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ds-parchment-2); object-fit: cover; }
  .people .faces img + img { margin-left: -10px; }
  .people .chev { color: var(--ds-ink-muted); font-size: 18px; }
  .print .says .ja { display: block; margin-top: 1px; font-family: var(--ds-font-sans); font-size: 11.5px; letter-spacing: 0; color: var(--ds-ink-muted); }
  .print .says .en { font-family: var(--hand); letter-spacing: 0; }
  .static .strip { transform: translateX(16px); }
</style>
</head>
<body>
<div class="modal">
  <div class="titlebar"><h2>旅の記録</h2><button class="close">✕ 閉じる</button></div>
  <div class="axes">
    <button aria-pressed="true">SNS<span class="dot"></span></button>
    <button aria-pressed="false">写真<span style="margin-left:6px;font-size:12px;color:var(--ds-ink-muted)">128</span></button>
  </div>

  <button class="people"><span class="label">出会った人</span>
    <span class="faces"><img src="img/face_monu.jpg" alt=""><img src="img/face_roohi.jpg" alt=""><img src="img/face_zoheb.jpg" alt=""><img src="img/face_hamid.jpg" alt=""></span><span class="chev">›</span></button>

  <section class="static">
    <div class="day"><span>デリー · 3日目</span><span class="rule"></span></div>
    <div class="viewport"><div class="strip">
      <figure class="print"><div class="photo"><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d25.webp" alt="">
        <span class="who"><img class="face" src="img/face_monu.jpg" alt="">モヌ</span><span class="where">インド門</span></div>
        <figcaption class="says"><span class="en">13 of us. Dadi shows it to the whole village.</span><span class="ja">十三人。ダーディーが村じゅうに見せてる</span></figcaption></figure>
    </div></div>
    <div class="comments" style="margin-top:4px">
      <p><img class="cf" src="img/face_heroine.jpg" alt=""><span><i class="nd"></i><b>あゆみ</b>十三人目です。また撮ってね</span></p>
      <p class="re"><img class="cf" src="img/face_monu.jpg" alt=""><span><b>モヌ</b>次は十四人で</span></p>
    </div>
  </section>

  <section class="static">
    <div class="day"><span>デリー · 2日目</span><span class="rule"></span>
      <button class="met" aria-label="この日に会った人"><img src="img/face_hamid.jpg" alt=""><img src="img/face_zoheb.jpg" alt=""><img src="img/face_monu.jpg" alt=""><span class="chev">›</span></button></div>
    <div class="viewport"><div class="strip">
      <figure class="print"><div class="photo"><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d036.webp" alt="">
        <span class="who"><img class="face" src="img/face_heroine.jpg" alt="">あゆみ</span><span class="where">ジャマー・マスジド</span></div>
        <figcaption class="says">雨の匂いを買いました。晴れの日に開けます</figcaption></figure>
      <figure class="print"><div class="photo"><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d038.webp" alt="">
        <span class="who"><img class="face" src="img/face_heroine.jpg" alt="">あゆみ</span><span class="where">ジャマー・マスジド</span></div>
        <figcaption class="says">雨の匂いを買いました。晴れの日に開けます</figcaption></figure>
    </div><button class="nav next" aria-label="次へ"><span>›</span></button></div>
    <div class="dots"><span class="group"><i class="on"></i><i></i></span><span class="group new"><i></i><i></i><i></i></span></div>
    <div class="comments">
      <p><img class="cf" src="img/face_zoheb.jpg" alt=""><span><b>ゾヘブ</b>賭けは負け。悔しいから一本買った</span></p>
      <p class="re"><img class="cf" src="img/face_heroine.jpg" alt=""><span><b>あゆみ</b>雨仲間ですね</span></p>
    </div>
  </section>
  <p class="sample-note">見本の画面（文は仮）</p>
</div>
</body>
</html>
