<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS 見本 7（人のタイムライン）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=Klee+One:wght@600&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="sns.css">
<style>
  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin: 0 0 4px -6px; padding: 0 8px; border: 0; background: transparent; color: var(--ds-ink); font: inherit; font-size: 14px; }
  .back b { font-size: 20px; font-weight: 400; }
  .profile { display: flex; align-items: center; gap: 14px; margin: 0 0 8px; }
  .profile .face { width: 68px; height: 68px; border: 2px solid var(--ds-parchment); box-shadow: 0 0 0 1px var(--ds-gold); }
  .profile h3 { margin: 0; font-family: var(--ds-font-serif); font-size: 20px; font-weight: 600; }
  .profile .title { margin: 2px 0 0; font-size: 13px; }
  .profile .met-at { margin: 4px 0 0; font-size: 12px; color: var(--ds-ink-muted); }
  .bio { margin: 4px 0 0; font-size: 14px; line-height: 1.6; }
  .profile { align-items: flex-start; }
  .memo { margin: 4px 0 6px; padding: 8px 10px; border-radius: 10px; background: var(--ds-parchment-2); }
  .memo-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ds-ink-muted); }
  .memo-label img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
  .memo p { margin: 3px 0 0; font-family: var(--hand); font-size: 14px; line-height: 1.5; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; margin: 0 -16px; padding: 0; list-style: none; }
  .grid3 li { aspect-ratio: 1; overflow: hidden; }
  .grid3 img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .grid3 .ph { display: grid; place-items: center; padding: 6px; background: #e9dcc2; border: 1px dashed #b9a47c; color: var(--ds-ink-muted); font-size: 11px; text-align: center; }
  .sec { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--ds-ink-muted); }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--ds-parchment-line); }
  .print .says .ja { display: block; margin-top: 1px; font-family: var(--ds-font-sans); font-size: 11.5px; letter-spacing: 0; color: var(--ds-ink-muted); }
  .print .says .en { font-family: var(--hand); letter-spacing: 0; }
  .static .strip { transform: translateX(16px); }
  /* その人のコメント：どの投稿へのコメントかを小さな写真で */
  .said { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .said img { width: 44px; height: 44px; flex: none; border-radius: 6px; object-fit: cover; }
  .said .to { font-size: 11px; color: var(--ds-ink-muted); }
  .said p { margin: 0; font-size: 14px; line-height: 1.5; }
  .said + .said { border-top: 1px solid rgba(217, 195, 154, 0.5); }
  .grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; margin: 0 -16px; padding: 0; list-style: none; }
  .grid5 img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
</style>
</head>
<body>
<div class="modal">
  <div class="titlebar"><h2>旅の記録</h2><button class="close">✕ 閉じる</button></div>
  <button class="back"><b>‹</b>SNS</button>

  <div class="profile">
    <img class="face" src="img/face_monu.jpg" alt="">
    <div><h3>モヌ</h3><p class="bio">ハリヤーナーの村から。<br>ダーディーの通訳係（無給）。<br>携帯の望遠を研究中</p></div>
  </div>
  <div class="memo"><span class="memo-label"><img src="img/face_heroine.jpg" alt="">あゆみのメモ</span>
    <p>村から来た男の子。デリー · 2日目にインド門で会った</p></div>

  <div class="sec">モヌの写真</div>
  <ul class="grid3"><li><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d25.webp" alt=""></li><li class="ph"><span>村の朝の水牛</span></li><li class="ph"><span>ダーディーのチャイ</span></li><li class="ph"><span>望遠で撮った月</span></li><li class="ph"><span>学校の帰り道</span></li><li class="ph"><span>従兄弟の結婚式</span></li></ul>

  <div class="sec">あゆみの投稿へのコメント</div>
  <div class="said"><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d060.webp" alt=""><div><p>来年はもっと望遠のきく携帯にする</p></div></div>

  <div class="sec">一緒に写っている写真</div>
  <ul class="grid5">
    <li><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d055.webp" alt=""></li><li><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d060.webp" alt=""></li><li><img src="../../../content/journeys/golden_triangle/public/assets/album/gt_album_d061.webp" alt=""></li>
  </ul>
  <p class="sample-note">見本の画面（文は仮。点線の枠は、新しく描く写真）</p>
</div>
</body>
</html>
